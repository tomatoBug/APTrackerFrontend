</html><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Multiworld Tracker</title>
    <!-- Prevent caching of latest content on GitHub Pages -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Google Font for Retro Arcade aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-black: #0b0c10;
            --container-bg: #12141c;
            --turquoise-primary: #40e0d0;
            --turquoise-glow: rgba(64, 224, 208, 0.4);
            --turquoise-dim: #1f6e66;
            --text-light: #e0fbf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            
            /* Dark retro background with subtle turquoise grid */
            background-color: var(--bg-black);
            background-image: 
                linear-gradient(rgba(64, 224, 208, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(64, 224, 208, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-light);
        }

        /* --- HEADER & SIGNATURE --- */
        .site-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .site-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.8rem;
            color: #ffffff;
            /* Vibrant retro text glow */
            text-shadow: 
                0 0 5px var(--turquoise-primary),
                0 0 10px var(--turquoise-primary),
                0 0 20px var(--turquoise-primary);
            margin: 0 0 1.2rem 0;
            letter-spacing: 2px;
            line-height: 1.4;
        }

        .site-subtitle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin: 0;
            font-size: 0.95rem;
            color: var(--turquoise-primary);
            font-weight: 500;
            background: rgba(18, 20, 28, 0.8);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            border: 1px solid var(--turquoise-dim);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .profile-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--turquoise-primary);
        }

        /* --- DASHBOARD CONTAINER --- */
        .dashboard-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* --- RETRO BANNER CONTAINERS --- */
        .banner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            
            /* Height & internal margin/padding space for the image */
            height: 140px;
            padding: 0.8rem 1.2rem; 
            
            /* Container styling */
            background-color: var(--container-bg);
            border: 2px solid var(--turquoise-dim);
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.7),
                inset 0 0 15px rgba(64, 224, 208, 0.05);
            transition: all 0.25s ease-in-out;
            cursor: pointer;
            position: relative;
            overflow: hidden;

            /* Shared image positioning & padding margins */
            background-size: auto 100%;
            background-position: left center;
            background-repeat: no-repeat;
            background-origin: content-box;
            background-clip: padding-box;
        }

        /* Hover Effect: Bright border and cyan glow */
        .banner:hover,
        .banner:focus-visible {
            border-color: var(--turquoise-primary);
            box-shadow: 
                0 0 20px var(--turquoise-glow),
                inset 0 0 10px rgba(64, 224, 208, 0.2);
            transform: translateY(-3px);
            outline: none;
        }

        .banner:hover .banner-title,
        .banner:focus-visible .banner-title {
            color: var(--turquoise-primary);
            text-shadow: 0 0 8px var(--turquoise-glow);
        }

        .banner-title {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            transition: all 0.25s ease-in-out;
            z-index: 2;
        }

        .apworld1 {
            background-image: 
                linear-gradient(90deg, transparent 0%, var(--container-bg) 60%),
                url('images/archipelago.png');
        }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 class="site-title">AP Multiworld Tracker</h1>
        <p class="site-subtitle">
            by <img src="images/profile.png" alt="tomatobug" class="profile-avatar" /> tomatobug
        </p> 
    </header>

    <main class="dashboard-container">

        <!-- Banner for AP World 1 -->
        <a href="apworld1.html" class="banner apworld1">
            <h2 class="banner-title">AP Multiworld 1 Progression</h2>
        </a>
        
        <!-- Banner for AP World 2 -->
        <a href="apworld2.html" class="banner apworld2">
            <h2 class="banner-title">Divi's Community Multiworld Progression</h2>
            <p class="banner-subtitle">WIP, Link not working</p>
        </a>

        </a-->

    </main>

</body>
