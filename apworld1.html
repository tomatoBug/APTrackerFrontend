        const plotDiv = document.getElementById("plotly-multiworld-chart");

        function getTraceIndices() {
            const indices = [];
            (plotDiv.layout.annotations || []).forEach(ann => {
                if (ann.name && ann.name.startsWith("badge_trace_")) {
                    indices.push(parseInt(ann.name.replace("badge_trace_", ""), 10));
                }
            });
            return indices;
        }

        function toggleSingleTrace(targetIdx) {
            const currentVis = plotDiv.data[targetIdx].visible;
            const isVisible = (currentVis === true || currentVis === undefined);
            const nextVis = isVisible ? "legendonly" : true;

            Plotly.restyle(plotDiv, { visible: nextVis }, [targetIdx]).then(() => {
                updateAnnotationOpacities();
            });
        }

        function isolateSingleTrace(targetIdx) {
            const allIndices = getTraceIndices();

            const isIsolated = allIndices.every(idx => {
                const v = plotDiv.data[idx].visible;
                return idx === targetIdx ? (v === true || v === undefined) : (v === "legendonly");
            });

            const updateArray = allIndices.map(idx => {
                if (isIsolated) return true;
                return idx === targetIdx ? true : "legendonly";
            });

            Plotly.restyle(plotDiv, { visible: updateArray }, allIndices).then(() => {
                updateAnnotationOpacities();
            });
        }

        function updateAnnotationOpacities() {
            const updateObj = {};
            (plotDiv.layout.annotations || []).forEach((ann, annIdx) => {
                if (ann.name && ann.name.startsWith("badge_trace_")) {
                    const traceIdx = parseInt(ann.name.replace("badge_trace_", ""), 10);
                    const v = plotDiv.data[traceIdx].visible;
                    const isVisible = (v === true || v === undefined);
                    updateObj[`annotations[${annIdx}].opacity`] = isVisible ? 1.0 : 0.35;
                }
            });

            Plotly.relayout(plotDiv, updateObj).then(() => {
                bindAnnotationClicks();
            });
        }

        function bindAnnotationClicks() {
            const annotations = plotDiv.layout.annotations || [];
            const annotationGroups = plotDiv.querySelectorAll('.annotation-text-g, .annotation-g');

            annotations.forEach((ann, annIdx) => {
                if (ann.name && ann.name.startsWith("badge_trace_")) {
                    const traceIdx = parseInt(ann.name.replace("badge_trace_", ""), 10);

                    const plainText = ann.text.replace(/<[^>]*>/g, '').trim();
